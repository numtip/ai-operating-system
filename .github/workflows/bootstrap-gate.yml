# AI-OS v1.6 — enforce bootstrap and portable Hermes release checks
name: Bootstrap Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: bootstrap-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap-gate:
    name: check-bootstrap + tests
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bootstrap gate (default)
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/check-bootstrap.ps1

      - name: Bootstrap gate (goffice2026 pilot)
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/check-bootstrap.ps1 -ProjectName goffice2026 -Json

      - name: Bootstrap gate unit tests
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/tests/test-check-bootstrap.ps1

      - name: Hermes portable installer plan tests
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/tests/test-hermes-portable-install.ps1
